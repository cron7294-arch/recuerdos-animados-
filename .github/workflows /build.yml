
name: Crear APK de Recuerdos Animados

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto Android
        run: |
          unzip -q RecuerdosAnimadosAndroid.zip -d proyecto
          PROJECT_DIR="$(dirname "$(find proyecto -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)")"
          if [ "$PROJECT_DIR" = "." ] || [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró el archivo settings.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar aplicación
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Recuerdos-Animados-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
