

name: Crear APK de Recuerdos Animados

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto Android
        run: |
          unzip -q RecuerdosAnimadosAndroid.zip -d proyecto
          SETTINGS_FILE="$(find proyecto -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "No se encontró el archivo de configuración de Gradle"
            find proyecto -maxdepth 4 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Proyecto Android encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar compatibilidad Java y Kotlin 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle.kts"

          if not gradle_file.exists():
              raise SystemExit(f"No se encontró: {gradle_file}")

          content = gradle_file.read_text()

          content += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          gradle_file.write_text(content)
          print("Compatibilidad Java y Kotlin 17 configurada")
          PY

      - name: Compilar aplicación
        run: |
          for intento in 1 2 3; do
            echo "Intento $intento de 3"
            if gradle -p "$PROJECT_DIR" assembleDebug; then
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              echo "Reintentando en 20 segundos..."
              sleep 20
            fi
          done
          exit 1

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Recuerdos-Animados-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
