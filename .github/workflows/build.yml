name: Crear APK de Recuerdos Animados

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto Android
        run: |
          unzip -q RecuerdosAnimadosAndroid.zip -d proyecto
          PROJECT_DIR="$(dirname "$(find proyecto -name settings.gradle.kts -print -quit)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar aplicación
        run: |
          for intento in 1 2 3; do
            echo "Intento $intento de 3"
            if gradle -p "$PROJECT_DIR" assembleDebug; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Recuerdos-Animados-APK
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
